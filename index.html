<style>
:root {
  --bg: #0a0e1a;
  --bg-card: #131927;
  --bg-elevated: #1a2236;
  --border: #2a3450;
  --text: #e8ecf4;
  --text-dim: #8b95ad;
  --accent: #d4ff3a;
  --accent-hover: #c2ed28;
  --accent-dim: #6b8519;
  --danger: #ff4d6d;
  --warning: #ffb84d;
  --success: #4dffa6;
  --font-display: 'Bebas Neue', 'Impact', sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
html, body {
  color: var(--text);
  font-family: var(--font-body);
  margin: 0;
  padding: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
}
body {
  background: var(--bg);
  overflow-y: auto;
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

.court-grid-bg {
  background-image: 
    linear-gradient(to right, rgba(212, 255, 58, 0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(212, 255, 58, 0.04) 1px, transparent 1px);
  background-size: 32px 32px;
}

.btn-primary {
  background: var(--accent);
  color: #0a0e1a;
  font-weight: 700;
  transition: all 0.15s ease;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border: none;
  cursor: pointer;
}
.btn-primary:hover:not(:disabled), .btn-primary:active:not(:disabled) { background: var(--accent-hover); }
.btn-primary:disabled { background: var(--accent); opacity: 0.35; cursor: not-allowed; }

.btn-secondary {
  background: var(--bg-elevated);
  color: var(--text);
  border: 1px solid var(--border);
  transition: all 0.15s ease;
  cursor: pointer;
}
.btn-secondary:hover, .btn-secondary:active { border-color: var(--accent); color: var(--accent); }

.btn-ghost {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  transition: all 0.15s ease;
  cursor: pointer;
}
.btn-ghost:hover, .btn-ghost:active { color: var(--text); border-color: var(--text-dim); }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.input {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  transition: border-color 0.15s ease;
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
}
.input:focus { outline: none; border-color: var(--accent); }

.display-font { font-family: var(--font-display); letter-spacing: 0.02em; }
.tabular-nums { font-variant-numeric: tabular-nums; }

.card, .max-w-4xl { max-width: 100%; }

.score-input {
  width: 100%;
  min-width: 0;
  padding: 12px 4px;
  font-size: 1.75rem;
  text-align: center;
  box-sizing: border-box;
}
.match-teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
}
.match-teams .team-name {
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.2;
  word-break: break-word;
  hyphens: auto;
}
.match-scores {
  display: grid;
  grid-template-columns: 1fr 16px 1fr;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
}
.match-result {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: start;
  gap: 8px;
}
.match-result .team-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.match-result .team-block .team-name {
  text-align: center;
  font-size: 0.85rem;
  font-weight: 600;
  line-height: 1.2;
}
.match-result .score-display {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.match-result .vs-colon {
  font-family: var(--font-display);
  font-size: 1.75rem;
  align-self: center;
  padding-top: 24px;
}

@media (max-width: 380px) {
  .match-teams .team-name { font-size: 0.85rem; }
  .score-input { font-size: 1.5rem; padding: 10px 2px; }
  .match-result .score-display { font-size: 1.875rem; }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(212, 255, 58, 0.4); }
  50% { box-shadow: 0 0 0 8px rgba(212, 255, 58, 0); }
}
.pulse-glow { animation: pulse-glow 2s infinite; }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.slide-in { animation: slideIn 0.3s ease-out; }

input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; }

.install-banner {
  position: fixed;
  bottom: env(safe-area-inset-bottom, 0);
  left: 0;
  right: 0;
  background: var(--accent);
  color: #0a0e1a;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 50;
  font-weight: 600;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-dim);
  transition: all 0.15s ease;
}
.chip.active { background: var(--accent); color: #0a0e1a; border-color: var(--accent); }
.chip.away { opacity: 0.5; }
</style>
</head>
<body>
<div id="root"></div>

<script>
document.getElementById('root').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#d4ff3a;font-family:Impact,sans-serif;font-size:24px;letter-spacing:0.05em">LADE PADEL...</div>';
window.addEventListener('error', (e) => {
